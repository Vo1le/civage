  diplo() {
    const m = this.$('modal'), e = this.e, me = e.me;
    m.style.display = 'block';
    m.style.width = 'min(500px, 95vw)';
    m.style.padding = '0';
    m.style.background = 'transparent';
    m.style.border = 'none';
    m.style.boxShadow = 'none';
    
    let html = `<div style="background: rgba(11,14,20,0.95); border: 1px solid #334155; border-radius: 12px; padding: 20px; backdrop-filter: blur(10px);">
      <h3 style="margin-top:0; color:#38bdf8;">🌍 Diplomatie Mondiale</h3>`;
      
    if (me.met.size === 0) {
       html += `<p style="color:#cbd5e1;">Vous n'avez rencontré aucune autre civilisation majeure pour le moment. Explorez le monde !</p>`;
    } else {
       html += `<div style="display:flex; flex-direction:column; gap:12px;">`;
       for (let tid of me.met) {
         const t = e.players.find(p => p.id === tid);
         if (!t) continue;
         const rel = me.relations[tid] || 'peace';
         const relText = rel === 'war' ? '⚔️ En Guerre' : (rel === 'alliance' ? '🤝 Allié' : '🕊️ Paix');
         html += `<div style="border:1px solid ${t.color}; border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:10px; background:rgba(255,255,255,0.02);">
           <div style="display:flex; justify-content:space-between; align-items:center;">
             <b style="color:${t.color}; font-size:16px;">${t.name}</b> <span style="font-size:12px; padding:3px 8px; border-radius:12px; background:rgba(0,0,0,0.3); border:1px solid #334155;">${relText}</span>
           </div>
           <div class="bt">`;
         
         if (rel === 'peace') {
           html += `<button data-diplo-act="war" data-target-id="${t.id}" style="background:#ef4444;color:#fff;">Déclarer Guerre</button>`;
           html += `<button data-diplo-act="alliance" data-target-id="${t.id}" style="background:#38bdf8;color:#000;">Proposer Alliance</button>`;
           html += `<button class="g" data-diplo-act="trade" data-target-id="${t.id}">Offrir Or (50💰)</button>`;
         } else if (rel === 'war') {
           html += `<button class="g" data-diplo-act="peace" data-target-id="${t.id}">Proposer la Paix</button>`;
         } else if (rel === 'alliance') {
           html += `<button data-diplo-act="break" data-target-id="${t.id}" style="background:#ef4444;color:#fff;">Rompre l'Alliance</button>`;
         }
         html += `</div></div>`;
       }
       html += `</div>`;
    }
    
    html += `<button class="g" style="margin-top:20px; width:100%;" onclick="document.getElementById('modal').style.display='none'">Fermer</button></div>`;
    m.innerHTML = html;
  }

  handleDiplo(act, targetId) {
    if (this.e.busy) return;
    const target = this.e.players.find(p => p.id === targetId);
    const me = this.e.me;
    
    if (act === 'war') {
       me.relations[targetId] = 'war';
       target.relations[me.id] = 'war';
       this.log(`⚔️ Vous avez déclaré la guerre à l'Empire de ${target.name} !`);
    } else if (act === 'alliance') {
       if (!target.isAI || Math.random() < 0.6) {
         me.relations[targetId] = 'alliance';
         target.relations[me.id] = 'alliance';
         this.log(`🤝 ${target.name} accepte votre alliance ! Vous partagez la vision.`);
         this.e.updateVis();
       } else {
         this.log(`❌ ${target.name} a poliment refusé votre proposition d'alliance.`);
       }
    } else if (act === 'peace') {
       if (!target.isAI || Math.random() < 0.5) {
         me.relations[targetId] = 'peace';
         target.relations[me.id] = 'peace';
         this.log(`🕊️ ${target.name} accepte le traité de paix.`);
       } else {
         this.log(`❌ ${target.name} refuse de faire la paix !`);
       }
    } else if (act === 'break') {
       me.relations[targetId] = 'peace';
       target.relations[me.id] = 'peace';
       this.log(`💔 Vous avez rompu l'alliance avec ${target.name}.`);
       this.e.updateVis();
    } else if (act === 'trade') {
       if (me.gold >= 50) {
         me.gold -= 50;
         target.gold += 50;
         this.log(`🎁 50 💰 envoyés à ${target.name}. Leurs relations s'améliorent.`);
       } else {
         this.log(`💸 Or insuffisant (50 💰 requis).`);
       }
    }
    this.diplo();
  }

  update() {
    const e = this.e, me = e.me, r = me.research, g = e.netGold();

    // Ressources stratégiques actives
    const resList = Object.entries(STRATEGIC_RESOURCES).map(([k, d]) => {
      const isUnlocked = me.techs.has(d.tech);
      if (!isUnlocked) return '';
      const count = e.map.tiles.filter(t => t.seen && t.resource === k).length;
      return `<div class="stat-badge">${d.icon} ${count}</div>`;
    }).join('');

    this.$('top').innerHTML = `
      <b>Civage</b>
      <div class="stat-badge">⌛ Tour ${e.turn}</div>
      ${e.mp ? `<div class="stat-badge" style="border-color:${e.players[e.cur].color}">👥 ${e.busy ? 'Tour de ' + e.players[e.cur].name : 'À vous de jouer'}</div>` : ''}
      <div class="stat-badge">💰 ${me.gold} (${g >= 0 ? '+' : ''}${g})</div>
      <div class="stat-badge">🔬 +${e.sciRate()}</div>
      <div class="stat-badge">🎭 ${me.culture} (+${e.cultRate()})</div>
      <div class="res-group">${resList}</div>
      <button class="g" data-a="tech" style="font-size:11px;margin-left:4px;">${r ? `🔬 ${TECHS[r].name} (${me.prog[r] || 0}/${TECHS[r].cost})` : '🔬 Choisir Technologie'}</button>
      <button class="g" data-a="gov" style="font-size:11px;">🏛️ ${GOVS[me.gov].name}</button>
      <button class="g" data-a="empire" style="font-size:11px;">📊 Empire</button>
      <button class="g" data-a="diplo" style="font-size:11px;">🌍 Diplo</button>
      <div class="stat-badge" style="margin-left:auto;">🏰 ${me.cities.length}/5 | ☠️ ${me.kills}</div>
    `;

    const I = this.$('info'), s = e.sel;
    let h = '';

    if (e.mode && e.mode.type === 'place_district') {
      const dName = DISTRICTS[e.mode.districtId].name;
      h = `<b>Placement de Quartier</b><br><small>Cliquez sur une case adjacente valide pour le quartier <b>${dName}</b>.</small>`;
    } else if (!s) {
      h = '<b>Mode Carte</b><br><small>Cliquez sur une unité ou une ville. Glissez pour déplacer la vue.</small>';
    } else if (s.kind === 'unit') {
      const u = s.o, t = u.tile;
      h = `<b>${u.d.icon} ${u.d.name}</b><br>
      PV ${u.hp}/${u.d.hp} · Force ${u.d.str} · PM ${u.mp}/${u.max} ${u.charges ? `· Charges 🔨:${u.charges}` : ''}<br>
      <small>Case : ${t.t.name} ${t.improvement ? `(${IMPROVEMENTS[t.improvement].name})` : ''} ${u.fort ? '· Fortifié' : ''}</small>
      <div class="bt">`;

      if (u.type === 'settler') h += `<button data-a="found" ${e.canFound(t) ? '' : 'disabled'}>Fonder une ville ⛺</button>`;

      if (u.type === 'builder') {
        Object.entries(IMPROVEMENTS).forEach(([impKey, imp]) => {
          if (t.improvement || t.district) return;
          
          let valid = false;
          if (impKey === 'pasture' && t.resource === 'horses') valid = true;
          if (impKey === 'mine' && (['hills', 'mountain', 'desert', 'tundra'].includes(t.type) || ['copper', 'iron', 'coal', 'uranium'].includes(t.resource))) valid = true;
          if (impKey === 'oil_well' && t.resource === 'oil') valid = true;
          if (impKey === 'farm' && ['plains', 'swamp'].includes(t.type) && !t.resource) valid = true;
          
          if (valid) {
            h += `<button data-a="imp" data-p="${impKey}">${imp.icon} ${imp.name}</button>`;
          }
        });
        if (t.type === 'forest') h += `<button data-a="clear">Défricher 🪵 (+20⚙)</button>`;
      }

      h += `<button class="g" data-a="fort">Fortifier 🛡️</button>
      <button class="g" data-a="skip">Passer ⏭</button>` +
      (t.city ? `<button class="g" data-a="city">Ouvrir Ville</button>` : '') +
      `</div>`;
    } else if (s.kind === 'city') {
      const c = s.o, y = c.yields();
      h = `<b>🏰 ${c.name}</b> (Pop. ${c.pop} | Frontières: ${c.radius})<br>
      🌾 ${c.food}/${8 + 4 * c.pop} (${y.sur >= 0 ? '+' : ''}${y.sur}) · ⚙ +${y.p} · 🔬 +${y.sci} · 💰 +${y.gold} · 🎭 +${y.cult}<br>
      ${c.b.size ? `<small>Bâtiments : ${[...c.b].map(i => BUILDINGS[i].name).join(', ')}</small><br>` : ''}
      ${c.districts.length ? `<small>Quartiers : ${c.districts.map(d => DISTRICTS[d.type].name).join(', ')}</small><br>` : ''}
      <small>Production : ${c.item ? (c.item.k === 'unit' ? UNITS : c.item.k === 'b' ? BUILDINGS : DISTRICTS)[c.item.id].name + ' — ' + c.turns() + ' tours' : 'Aucune'}</small>
      <div class="bt" style="flex-direction:column;max-height:160px;overflow-y:auto;">` +
      e.avail(c).map(o => `<button class="${c.item && c.item.id === o.id ? '' : 'g'}" data-a="prod" data-p="${o.k}:${o.id}" style="text-align:left;justify-content:space-between;">
        <span>${o.d.icon || ''} ${o.d.name}</span> <small>${o.d.cost} ⚙${o.id === 'settler' ? ' (−1 pop)' : ''}</small>
      </button>`).join('') + `</div>`;
    } else {
      const t = s.o;
      const y = e.tileYields(t, me);
      h = `<b>${t.t.name}</b> (${t.c}, ${t.r})<br>
      Rendements : 🌾 ${y.f} · ⚙ ${y.p} · 💰 ${y.g}<br>
      Mouvement : ${t.t.move >= 99 ? '—' : t.t.move} · Def +${t.t.def * 100}%<br>
      ${t.resource && me.techs.has(STRATEGIC_RESOURCES[t.resource].tech) ? `<small>Ressource : ${STRATEGIC_RESOURCES[t.resource].icon} <b>${STRATEGIC_RESOURCES[t.resource].name}</b> (${STRATEGIC_RESOURCES[t.resource].desc})</small><br>` : ''}
      ${t.improvement ? `<small>Aménagement : ${IMPROVEMENTS[t.improvement].icon} ${IMPROVEMENTS[t.improvement].name}</small><br>` : ''}
      ${t.district ? `<small>Quartier : ${DISTRICTS[t.district.type].icon} ${DISTRICTS[t.district.type].name} (${t.district.cityName})</small><br>` : ''}
      ${t.barbCamp ? `<small style="color:#ef4444;">🏕️ <b>Campement Barbare !</b> (Capturez-le avec une unité militaire pour +50 💰)</small>` : ''}`;
    }

    I.innerHTML = h;
    this.$('end').disabled = e.over || e.busy;
    this.dirty = true;
  }

  loop() {
    this.update();
    let last = 0;
    const f = ts => {
      if (this.dirty || this.e.floatingTexts.length || ts - last > 250) { last = ts; this.dirty = false; this.draw(); this.drawMini(); }
      requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  }

  draw() {
    const e = this.e, c = this.cx, cam = e.cam, S = CFG.HEX, d = this.d, W = innerWidth, H = innerHeight;
    c.setTransform(d, 0, 0, d, 0, 0);
    c.fillStyle = '#07090e';
    c.fillRect(0, 0, W, H);
    c.save();
    c.translate(cam.x, cam.y);
    c.scale(cam.z, cam.z);

    c.textAlign = 'center';
    c.textBaseline = 'middle';

    // 1. RENDU DU MAP & BIOMES
    for (const t of e.map.tiles) {
      const p = Hex.toPx(t.c, t.r), sx = p.x * cam.z + cam.x, sy = p.y * cam.z + cam.y;
      if (sx < -60 || sy < -60 || sx > W + 60 || sy > H + 60) continue;

      Hex.path(c, p.x, p.y, S);
      c.fillStyle = t.seen ? t.t.col : '#11151f';
      c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.2)';
      c.stroke();

      if (!t.seen) continue;

      // Éléments de terrain
      const G = GLYPH;
      if (G[t.type]) {
        c.font = '15px sans-serif';
        c.fillStyle = G[t.type][1];
        c.fillText(G[t.type][0], p.x, p.y - 4);
      }

      // Rendu des Ressources Stratégiques (si la technologie est débloquée)
      if (t.resource && e.me.techs.has(STRATEGIC_RESOURCES[t.resource].tech)) {
        const resDef = STRATEGIC_RESOURCES[t.resource];
        c.font = '14px sans-serif';
        c.fillText(resDef.icon, p.x - 10, p.y + 8);
      }

      // Rendu des Aménagements de Bâtisseur
      if (t.improvement) {
        c.font = '13px sans-serif';
        c.fillText(IMPROVEMENTS[t.improvement].icon, p.x + 10, p.y + 8);
      }

      // Rendu des Campements Barbares
      if (t.barbCamp) {
        c.font = '18px sans-serif';
        c.fillText('🏕️', p.x, p.y - 2);
      }

      // Rendu des Quartiers Spécialisés
      if (t.district) {
        const dDef = DISTRICTS[t.district.type];
        Hex.path(c, p.x, p.y, S - 4);
        c.fillStyle = 'rgba(0,0,0,0.45)';
        c.fill();
        c.strokeStyle = dDef.col;
        c.lineWidth = 3;
        c.stroke();
        c.lineWidth = 1;
        c.font = '17px sans-serif';
        c.fillText(dDef.icon, p.x, p.y);
      }
      
      // Rendu du Système de Rendement (Yields) conditionnel
      let showYields = false;
      if (e.mode && e.mode.type === 'place_district') showYields = true;
      else if (e.sel && e.sel.kind === 'tile' && e.sel.o === t) showYields = true;

      if (showYields && t.seen && !t.city && !t.district) {
        const y = e.tileYields(t, e.me);
        let yText = '';
        if (y.f > 0) yText += `🌾${y.f} `;
        if (y.p > 0) yText += `⚙${y.p} `;
        if (y.g > 0) yText += `💰${y.g}`;
        if (yText) {
          c.font = 'bold 10px sans-serif';
          c.fillStyle = t.vis ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.35)';
          c.fillText(yText.trim(), p.x, p.y + 17);
        }
      }

      // Brouillard de guerre
      if (!t.vis) {
        Hex.path(c, p.x, p.y, S);
        c.fillStyle = 'rgba(7,9,14,0.58)';
        c.fill();
      }
    }

    // --- Zone d'action de la ville (Frontières dynamiques en surbrillance) ---
    let activeTerritory = [];
    let terrColor = 'rgba(255, 255, 255, 0.1)';
    
    if (e.sel) {
      if (e.sel.kind === 'city') {
        activeTerritory = e.map.within(e.sel.o.tile, e.sel.o.radius);
        terrColor = e.sel.o.owner.color;
      } else if (e.sel.kind === 'unit' && e.sel.o.type === 'builder') {
        const nearCity = e.me.cities.reduce((b, c) => !b || Hex.dist(c.tile, e.sel.o.tile) < Hex.dist(b.tile, e.sel.o.tile) ? c : b, null);
        if (nearCity) {
          activeTerritory = e.map.within(nearCity.tile, nearCity.radius);
          terrColor = nearCity.owner.color;
        }
      }
    }
    
    if (activeTerritory.length > 0) {
      c.save();
      activeTerritory.forEach(t => {
        if (!t.seen) return;
        const p = Hex.toPx(t.c, t.r);
        Hex.path(c, p.x, p.y, S - 2);
        
        c.fillStyle = terrColor;
        c.globalAlpha = 0.15;
        c.fill();
        
        c.strokeStyle = terrColor;
        c.globalAlpha = 0.7;
        c.lineWidth = 2;
        c.stroke();
      });
      c.restore();
    }

    // Highlighting / Mode placement de quartier
    if (e.mode && e.mode.type === 'place_district') {
      const { city, districtId } = e.mode;
      e.map.tiles.forEach(t => {
        if (e.isValidDistrictTile(t, city, districtId)) {
          const p = Hex.toPx(t.c, t.r);
          Hex.path(c, p.x, p.y, S - 2);
          c.fillStyle = 'rgba(168, 85, 247, 0.35)';
          c.fill();
          c.strokeStyle = '#a855f7';
          c.lineWidth = 2.5;
          c.stroke();
          c.lineWidth = 1;
        }
      });
    }

    // Highlighting Déplacement / Attaque
    const mark = (t, col, fill) => {
      const p = Hex.toPx(t.c, t.r);
      Hex.path(c, p.x, p.y, S - 2);
      if (fill) { c.fillStyle = fill; c.fill(); }
      c.strokeStyle = col;
      c.lineWidth = 3;
      c.stroke();
      c.lineWidth = 1;
    };

    // A* Path visualization (Confirmé & Planifié)
    if (e.sel && e.sel.kind === 'unit') {
      const u = e.sel.o;
      const pathToDraw = u.tempPath || u.path;
      
      if (pathToDraw && pathToDraw.length > 0) {
        c.beginPath();
        const startP = Hex.toPx(u.tile.c, u.tile.r);
        c.moveTo(startP.x, startP.y);
        pathToDraw.forEach(pt => {
          const px = Hex.toPx(pt.c, pt.r);
          c.lineTo(px.x, px.y);
        });
        c.strokeStyle = u.tempPath ? 'rgba(250, 204, 21, 0.85)' : 'rgba(255, 255, 255, 0.75)';
        c.lineWidth = 3;
        c.setLineDash([6, 6]);
        c.stroke();
        c.setLineDash([]);
        c.lineWidth = 1;

        // Draw end marker
        const endTile = pathToDraw[pathToDraw.length - 1];
        const endP = Hex.toPx(endTile.c, endTile.r);
        c.fillStyle = u.tempPath ? 'rgba(250, 204, 21, 0.85)' : 'rgba(255, 255, 255, 0.8)';
        c.beginPath();
        c.arc(endP.x, endP.y, 5, 0, Math.PI*2);
        c.fill();
      }
    }

    if (e.reach) {
      e.reach.res.forEach((v, t) => {
        mark(t, '#22c55e', 'rgba(34, 197, 94, 0.22)');
        const q = Hex.toPx(t.c, t.r);
        c.fillStyle = '#fff';
        c.font = 'bold 11px sans-serif';
        c.fillText(v.d, q.x, q.y + 11);
      });
      e.reach.att.forEach(t => mark(t, '#ef4444', 'rgba(239, 68, 68, 0.32)'));
    }

    const s = e.sel;
    if (s) mark(s.kind === 'tile' ? s.o : s.o.tile, '#facc15');

    // Villes & Unités
    for (const t of e.map.tiles) {
      if (!t.seen) continue;
      const p = Hex.toPx(t.c, t.r);

      if (t.city) {
        c.fillStyle = t.city.owner.color;
        c.beginPath();
        c.arc(p.x, p.y - 4, 14, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = '#fff';
        c.lineWidth = 2;
        c.stroke();
        c.lineWidth = 1;

        c.fillStyle = '#fff';
        c.font = 'bold 13px sans-serif';
        c.fillText(t.city.pop, p.x, p.y - 4);

        c.font = 'bold 11px sans-serif';
        c.fillStyle = '#f1ece0';
        c.fillText(t.city.name, p.x, p.y - 24);

        if (t.city.siege) {
          c.font = '18px sans-serif';
          c.fillText('⚔️', p.x, p.y - 40);
        }
      }

      if (t.unit && t.vis) {
        const u = t.unit, ox = t.city ? 14 : 0, oy = t.city ? 10 : 0;
        c.beginPath();
        c.arc(p.x + ox, p.y + oy, 11, 0, Math.PI * 2);
        c.fillStyle = u.owner.color;
        c.fill();
        c.strokeStyle = u.fort ? '#facc15' : '#fff';
        c.lineWidth = 2;
        c.stroke();
        c.lineWidth = 1;

        c.fillStyle = '#fff';
        c.font = 'bold 11px sans-serif';
        c.fillText(u.d.ch, p.x + ox, p.y + oy);

        // Barre de PV
        if (u.hp < u.d.hp) {
          c.fillStyle = '#400';
          c.fillRect(p.x + ox - 10, p.y + oy + 13, 20, 3);
          c.fillStyle = '#22c55e';
          c.fillRect(p.x + ox - 10, p.y + oy + 13, 20 * (u.hp / u.d.hp), 3);
        }
      }
    }

    // 2. RENDU DES TEXTES FLOTTANTS VISUELS (Dégâts, Captures, Victories)
    for (let i = e.floatingTexts.length - 1; i >= 0; i--) {
      const ft = e.floatingTexts[i];
      ft.update();
      ft.draw(c);
      if (ft.life <= 0) e.floatingTexts.splice(i, 1);
    }

    c.restore();
  }

  drawMini() {
    const e = this.e, m = this.mx;
    m.fillStyle = '#07090e';
    m.fillRect(0, 0, 130, 90);
    const sx = 130 / CFG.W, sy = 90 / CFG.H;

    for (const t of e.map.tiles) {
      if (!t.seen) continue;
      const x = (t.c + 0.5 * (t.r & 1)) * sx;
      const y = t.r * sy;
      m.fillStyle = t.t.col;
      m.globalAlpha = t.vis ? 1 : 0.45;
      m.fillRect(x, y, sx, sy);
      m.globalAlpha = 1;

      if (t.city) {
        m.fillStyle = '#fff';
        m.fillRect(x, y, 4, 4);
      } else if (t.unit && t.vis) {
        m.fillStyle = t.unit.owner.color;
        m.fillRect(x + 1, y + 1, 3, 3);
      } else if (t.barbCamp) {
        m.fillStyle = '#ef4444';
        m.fillRect(x + 1, y + 1, 3, 3);
      }
    }
  }
}

const GLYPH = { forest: ['🌲', '#1b3b1d'], mountain: ['▲', '#cfc8bd'], hills: ['∩', '#524320'], swamp: ['≈', '#283b2c'], desert: ['░', '#7a672b'], tundra: ['❄', '#526361'] };

/* ================= FOND DU MENU : CARTE DÉFILANTE AVEC CIVILISATIONS ================= */
const Menu = (() => {
  const S = 22, N = 72, R = 44, SW = S * 1.7320508, W = SW * N, H = S * 1.5 * R;
  const CIV = [['Rome', '#dc2626'], ['Égypte', '#fbbf24'], ['Japon', '#f1f5f9'], ['Aztèques', '#22c55e'], ['Mali', '#f97316'], ['Perse', '#a855f7'], ['Vikings', '#38bdf8']];
  const P = (c, r) => [SW * (c + .5 * (r & 1)), S * 1.5 * r];
  const wd = (a, b) => { const d = Math.abs(a - b); return Math.min(d, W - d); };
  const hex = (g, x, y, s) => { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30); g.lineTo(x + s * Math.cos(a), y + s * Math.sin(a)); } g.closePath(); };
  let cv, cx, off, cities = [], armies = [], raf = 0, last = 0;
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function build() {
    off = document.createElement('canvas'); off.width = W; off.height = H;
    const g = off.getContext('2d');
    const ph = Array.from({ length: 5 }, () => [1 + (Math.random() * 3 | 0), Math.random() * 6.28, 1 + Math.random() * 2, Math.random() * 6.28, .5 + Math.random()]);
    const grid = [];
    for (let r = 0; r < R; r++) { grid[r] = []; for (let c = 0; c < N; c++) {
      let v = 0; for (const [f, p, fy, q, a] of ph) v += a * Math.sin(6.283 * f * c / N + p + 1.6 * Math.sin(6.283 * fy * r / R + q));
      v = v / 5 + (Math.random() - .5) * .1 - Math.max(0, 3 - Math.min(r, R - 1 - r)) * .15;
      grid[r][c] = { c, r, o: -1, ty: v < 0 ? 'deep_water' : v < .1 ? 'coastal_water' : v > .5 ? 'mountain' : v > .36 ? 'hills' : Math.random() < .3 ? 'forest' : 'plains' };
    } }
    const flat = grid.flat(), land = t => !/water|mountain/.test(t.ty), cent = [];
    for (let k = 0, tries = 0; k < CIV.length && tries < 4000; tries++) {
      const t = flat[Math.random() * flat.length | 0]; if (t.ty !== 'plains') continue;
      const [x, y] = P(t.c, t.r);
      if (cent.some(q => wd(q.x, x) + Math.abs(q.y - y) < 14 * SW)) continue;
      cent.push({ x, y }); k++;
    }
    for (const t of flat) if (land(t) || t.ty === 'mountain') {
      const [x, y] = P(t.c, t.r); let best = 9.5 * SW;
      cent.forEach((q, i) => { const d = Math.hypot(wd(q.x, x), y - q.y); if (d < best) { best = d; t.o = i; } });
    }
    cities = []; armies = [];
    cent.forEach((q, i) => {
      cities.push({ x: q.x, y: q.y, i, cap: true });
      flat.filter(t => t.o === i && land(t)).sort(() => Math.random() - .5).forEach(t => {
        const [x, y] = P(t.c, t.r);
        if (cities.filter(c => c.i === i).length < 4 && cities.every(c => c.i !== i || Math.hypot(wd(c.x, x), c.y - y) > 4.5 * SW)) cities.push({ x, y, i });
      });
      const mine = cities.filter(c => c.i === i);
      for (let k = 1; k < mine.length; k++) armies.push({ a: mine[0], b: mine[k], p: Math.random(), v: 2e-4 + Math.random() * 3e-4, col: CIV[i][1] });
    });
    const edge = x => x > W - 2 * S ? [x, x - W] : x < 2 * S ? [x, x + W] : [x];
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const t of flat) {
      const [x, y] = P(t.c, t.r), col = CIV[t.o] && CIV[t.o][1];
      for (const X of edge(x)) {
        hex(g, X, y, S); g.fillStyle = TERRAIN[t.ty].col; g.fill();
        if (col) { g.globalAlpha = .28; g.fillStyle = col; g.fill(); g.globalAlpha = 1; }
        g.strokeStyle = 'rgba(0,0,0,.22)'; g.stroke();
        if (GLYPH[t.ty]) { g.font = '15px sans-serif'; g.fillStyle = 'rgba(0,0,0,.4)'; g.fillText(GLYPH[t.ty][0], X, y); }
      }
    }
    for (const t of flat) if (t.o >= 0 && Hex.odd[t.r & 1].some(([a, b]) => { const n = grid[t.r + b] && grid[t.r + b][(t.c + a + N) % N]; return !n || n.o !== t.o; })) {
      const [x, y] = P(t.c, t.r);
      for (const X of edge(x)) { hex(g, X, y, S - 1.5); g.strokeStyle = CIV[t.o][1]; g.globalAlpha = .9; g.lineWidth = 2.5; g.stroke(); g.globalAlpha = 1; g.lineWidth = 1; }
    }
    g.setLineDash([6, 8]); g.lineWidth = 2; g.strokeStyle = 'rgba(241,236,224,.35)';
    armies.forEach(a => { if (Math.abs(a.a.x - a.b.x) < W / 2) { g.beginPath(); g.moveTo(a.a.x, a.a.y); g.lineTo(a.b.x, a.b.y); g.stroke(); } });
  }

  function frame(ts) {
    const w = cv.width, h = cv.height, s = Math.max(h / H, .8), ox = (ts * .018) % W, y0 = (h - H * s) / 2, dt = ts - last; last = ts;
    cx.fillStyle = '#07090e'; cx.fillRect(0, 0, w, h);
    for (let x = -ox * s; x < w; x += W * s) cx.drawImage(off, x, y0, W * s + 1, H * s);
    const X = wx => (((wx - ox) % W) + W) % W * s, draw = (wx, wy, fn) => { const sx = X(wx), sy = y0 + wy * s; fn(sx, sy); fn(sx - W * s, sy); };
    for (const c of cities) draw(c.x, c.y, (x, y) => {
      cx.fillStyle = CIV[c.i][1]; cx.strokeStyle = '#fff'; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(x, y, c.cap ? 7 : 4.5, 0, 6.283); cx.fill(); cx.stroke();
      if (c.cap) { cx.font = 'bold 15px Georgia, serif'; cx.textAlign = 'center'; cx.lineWidth = 4; cx.strokeStyle = '#07090e'; cx.strokeText(CIV[c.i][0], x, y - 17); cx.fillStyle = '#f1ece0'; cx.fillText(CIV[c.i][0], x, y - 17); }
    });
    for (const a of armies) {
      a.p += a.v * dt; if (a.p > 1) { [a.a, a.b] = [a.b, a.a]; a.p = 0; }
      let dx = a.b.x - a.a.x; if (Math.abs(dx) > W / 2) dx -= Math.sign(dx) * W;
      draw(a.a.x + dx * a.p, a.a.y + (a.b.y - a.a.y) * a.p, (x, y) => { cx.fillStyle = a.col; cx.strokeStyle = '#fff'; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(x, y, 4, 0, 6.283); cx.fill(); cx.stroke(); });
    }
    if (!rm) raf = requestAnimationFrame(frame);
  }
  const size = () => { cv.width = innerWidth; cv.height = innerHeight; if (rm && off) frame(0); };
  return {
    start() { cv = document.getElementById('menu-bg'); cx = cv.getContext('2d'); build(); size(); addEventListener('resize', size); rm ? frame(0) : (raf = requestAnimationFrame(frame)); },
    stop() { cancelAnimationFrame(raf); removeEventListener('resize', size); off = null; }
  };
})();

/* ================= PUBLICITÉS (Google AdSense) =================
   1. Renseignez client + slot ci-dessous (fournis par AdSense).
   2. N'appelez initAds() qu'APRÈS le consentement RGPD (bannière CMP).
   Tant que ADS.client est vide, l'espace réservé reste affiché. */
const ADS = { client: '', slot: '' }; // ex. { client: 'ca-pub-1234567890123456', slot: '1234567890' }
function initAds() {
  const box = document.getElementById('ad-slot');
  if (!ADS.client || !box || window.__adsOn) return;
  window.__adsOn = true;
  const s = document.createElement('script');
  s.async = true; s.crossOrigin = 'anonymous';
  s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + ADS.client;
  s.onload = () => {
    box.style.border = '0'; box.style.background = 'none';
    box.innerHTML = `<ins class="adsbygoogle" style="display:block;width:300px;height:250px" data-ad-client="${ADS.client}" data-ad-slot="${ADS.slot}"></ins>`;
    (window.adsbygoogle = window.adsbygoogle || []).push({});
  };
  document.head.appendChild(s);
}

/* ================= MULTIJOUEUR P2P (PeerJS / WebRTC) =================
   Tour par tour « à la suite » : le joueur actif joue avec le moteur normal, puis envoie
   l’état complet du monde au suivant. Le dernier joueur de la manche résout aussi IA + barbares.
   Aucun serveur de jeu : l’hôte sert seulement de relais entre navigateurs. */
const Net = (() => {
  let peer, conns = [], hostConn = null, isHost = false;
  const $ = id => document.getElementById(id), st = h => { $('mp-status').innerHTML = h; }, gm = () => window.game;
  const lock = () => { $('btn-host').disabled = $('btn-join').disabled = true; };
  function guestMsg(m) {
    if (m.t === 'start') { Object.assign(CFG, m.cfg); Menu.stop(); $('start-screen').style.display = 'none'; window.game = new GameEngine(); }
    else if (m.t === 'state' && gm()) gm().load(m.s);
  }
  return {
    host() {
      if (typeof Peer === 'undefined') return st('⚠ PeerJS introuvable (hors ligne ?).');
      isHost = true; lock();
      const id = Math.random().toString(36).slice(2, 6).toUpperCase();
      peer = new Peer('civage-' + id);
      peer.on('error', e => st('⚠ Erreur réseau : ' + e.type));
      peer.on('open', () => st(`Code : <b style="font-size:18px;color:#facc15">${id}</b><br><small>Lien : ${location.href.split('#')[0]}#${id}</small><br><span id="mp-n">Aucun invité pour l’instant.</span>`));
      peer.on('connection', c => {
        c.on('data', m => {
          if (m.t === 'hello' && !gm() && conns.length < 3) {
            c._n = String(m.name || 'Joueur').slice(0, 14); conns.push(c);
            $('mp-n').textContent = 'Joueurs : vous + ' + conns.map(x => x._n).join(', ');
          } else if (m.t === 'state' && gm()) { gm().load(m.s); conns.forEach(x => x !== c && x.open && x.send(m)); }
        });
        c.on('close', () => { conns = conns.filter(x => x !== c); if (gm()) gm().log('⚠ ' + (c._n || 'Un joueur') + ' s’est déconnecté.'); });
      });
    },
    join(code) {
      if (typeof Peer === 'undefined') return st('⚠ PeerJS introuvable (hors ligne ?).');
      code = (code || '').trim().toUpperCase(); if (!code) return st('Saisissez le code de la partie.');
      lock(); st('Connexion…');
      peer = new Peer();
      peer.on('error', e => { st('⚠ Erreur : ' + e.type); $('btn-join').disabled = false; });
      peer.on('open', () => {
        hostConn = peer.connect('civage-' + code, { serialization: 'json', reliable: true });
        hostConn.on('open', () => { hostConn.send({ t: 'hello', name: $('cfg-name').value || 'Invité' }); st('✅ Connecté. L’hôte va lancer la partie…'); $('btn-start').style.display = 'none'; });
        hostConn.on('data', guestMsg);
        hostConn.on('close', () => gm() ? gm().log('⚠ L’hôte s’est déconnecté.') : st('⚠ Hôte déconnecté.'));
      });
    },
    launch() {
      if (isHost && conns.length) {
        CFG.humans = [CFG.playerName, ...conns.map(c => c._n)]; CFG.localId = 0;
        const { W, H, mapType, aiCount, barbDensity, barbEvery, humans } = CFG;
        conns.forEach((c, i) => c.send({ t: 'start', cfg: { W, H, mapType, aiCount, barbDensity, barbEvery, humans, localId: i + 1 } }));
      }
      window.game = new GameEngine();
      if (window.game.mp) this.sendState(window.game);
    },
    sendState(g) { const m = { t: 'state', s: g.snapshot() }; (isHost ? conns : hostConn ? [hostConn] : []).forEach(c => c.open && c.send(m)); }
  };
})();

// Initialisation au chargement de la fenêtre
window.onload = () => {
  Menu.start();
  initAds();
  document.getElementById('btn-host').onclick = () => Net.host();
  document.getElementById('btn-join').onclick = () => Net.join(document.getElementById('mp-code').value);
  if (location.hash.length > 1) document.getElementById('mp-code').value = location.hash.slice(1, 5);
  document.getElementById('btn-start').onclick = () => {
    // Lecture des configurations
    CFG.playerName = document.getElementById('cfg-name').value || 'Empereur';
    const size = document.getElementById('cfg-size').value;
    if (size === 'small') { CFG.W = 30; CFG.H = 20; }
    else if (size === 'medium') { CFG.W = 45; CFG.H = 30; }
    else if (size === 'large') { CFG.W = 60; CFG.H = 40; }
    
    CFG.mapType = document.getElementById('cfg-type').value;
    CFG.aiCount = parseInt(document.getElementById('cfg-ai').value);
    CFG.barbDensity = document.getElementById('cfg-barb').value;
    
    if (CFG.barbDensity === 'low') CFG.barbEvery = 15;
    else if (CFG.barbDensity === 'high') CFG.barbEvery = 6;
    else CFG.barbEvery = 10;
    
    Menu.stop();
    document.getElementById('start-screen').style.display = 'none';
    Net.launch();
  };
};
</script>
